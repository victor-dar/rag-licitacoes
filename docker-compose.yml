x-ambiente: &ambiente
  QDRANT_URL: http://qdrant:6333
  COLLECTION: licitacoes
  EMBED_MODEL: ${EMBED_MODEL:-intfloat/multilingual-e5-small}
  DATA_DIR: /app/data
  HF_HOME: /cache/hf

services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # roda uma vez: baixa a lei (se data/ estiver vazio), faz o chunking e indexa
  ingest:
    build: .
    command: python -m ingest.main
    environment: *ambiente
    volumes:
      - ./data:/app/data
      - hf_cache:/cache/hf
    depends_on:
      - qdrant

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      <<: *ambiente
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-token}
    volumes:
      - ./data:/app/data
      - hf_cache:/cache/hf
    depends_on:
      ingest:
        condition: service_completed_successfully

  # opcional: docker compose --profile automacao up
  n8n:
    image: n8nio/n8n:1.76.1
    profiles: ["automacao"]
    ports:
      - "5678:5678"
    environment:
      NODE_FUNCTION_ALLOW_BUILTIN: crypto
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-token}
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  qdrant_data:
  hf_cache:
  n8n_data:
